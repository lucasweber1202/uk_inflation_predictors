[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[project]
name = "uk-inflation-predictors"
version = "0.1.0"
description = "Point-in-time research engine for UK CPI predictors"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "sqlalchemy>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6", "types-PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["scripts", "tests"]
explicit_package_bases = true
mypy_path = "."
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
